name: docs site
# Builds https://docs.pearos.xyz/ from the Markdown files of this repository (they stay where they are;
# .site/build.py copies them, generates the navigation and folder overviews, and runs MkDocs Material).
# Every push to main rebuilds it, so a new or changed .md is on the site a minute later.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history: "Last updated" comes from the last commit of each file
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: .site/requirements.txt }
      - run: pip install -r .site/requirements.txt
      - run: python .site/build.py
      - uses: actions/upload-pages-artifact@v3
        with: { path: _build/site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deployment.outputs.page_url }}" }
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
